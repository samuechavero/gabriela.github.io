kind = "web"
previewPath = "/"
title = "Dra. Gabriela Gonzalez - Medicina Integral"
version = "1.0.0"
id = "artifacts/dra-gabriela"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26231

[services.development]
run = "pnpm --filter @workspace/dra-gabriela run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dra-gabriela", "run", "build" ]
publicDir = "artifacts/dra-gabriela/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26231"
BASE_PATH = "/"
